<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coastal Medical Transportation Systems</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--tx:#14262e;--mut:#50646d;--pri:#0a5c7a;--pri2:#0a3d52;--red:#c8372d;--redbtn:#c8372d;--ok:#176b46;--warn:#8a5a00;--bd:#d5e0e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a20;--card:#16262e;--tx:#e6eff3;--mut:#93a8b2;--pri:#4fb3d6;--pri2:#0a3d52;--red:#ef6b60;--redbtn:#b3261e;--ok:#4cc995;--warn:#e8a93b;--bd:#27414c}}
:root[data-theme="dark"]{--bg:#0e1a20;--card:#16262e;--tx:#e6eff3;--mut:#93a8b2;--pri:#4fb3d6;--pri2:#0a3d52;--red:#ef6b60;--redbtn:#b3261e;--ok:#4cc995;--warn:#e8a93b;--bd:#27414c}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
h1,h2,h3{margin:0 0 .5rem;line-height:1.2}h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:.5rem .6rem;width:100%}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:.5rem .9rem;cursor:pointer;font-weight:600}
:root[data-theme="dark"] .btn:not(.sec):not(.red){color:#06222d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.sec):not(.red){color:#06222d}}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.red{background:var(--redbtn);color:#fff}.btn.sm{padding:.25rem .55rem;font-size:.85rem}
#app{display:flex;min-height:100%}
nav{width:220px;background:var(--pri2);color:#e6f3f8;padding:1rem .6rem;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
nav .brand{padding:.3rem .2rem 1rem;display:block;line-height:1.25}nav .brand .lg{background:#fff;border-radius:8px;padding:.4rem;display:block;margin-bottom:.6rem}nav .brand img,#login .lg img{width:100%;height:auto;display:block}nav .brand b{display:block;font-size:.95rem}nav .brand small{opacity:.8;font-size:.78rem}#login .lg{background:#fff;border-radius:10px;padding:.7rem;max-width:300px;margin-bottom:1.2rem}
nav a{color:inherit;text-decoration:none;padding:.55rem .7rem;border-radius:6px;cursor:pointer;display:flex;gap:.6rem}
nav a.on,nav a:hover{background:rgba(255,255,255,.14)}
main{flex:1;min-width:0;padding:1rem 1.25rem 3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat b{font-size:1.8rem;display:block;color:var(--pri)}.stat span{color:var(--mut);font-size:.85rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.bar{background:var(--bg);border-radius:99px;height:10px;overflow:hidden;border:1px solid var(--bd)}.bar i{display:block;height:100%;background:var(--pri)}.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}
.row{display:grid;grid-template-columns:150px 1fr 48px;gap:.6rem;align-items:center;margin:.4rem 0;font-size:.9rem}
.tag{padding:.1rem .5rem;border-radius:99px;font-size:.78rem;border:1px solid var(--bd);display:inline-block}
.tag.Completed,.tag.Approved,.tag.Competent{color:var(--ok);border-color:var(--ok)}.tag.Needs\ Remediation{color:var(--red);border-color:var(--red)}.tag.In\ Progress,.tag.Pending{color:var(--warn);border-color:var(--warn)}
form.f{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}form.f .w{grid-column:1/-1}label{font-size:.82rem;color:var(--mut);display:block;margin-bottom:2px}
.tl{display:flex;gap:0;overflow-x:auto;padding:.5rem 0}.tl div{flex:1;min-width:120px;border-top:4px solid var(--bd);padding-top:.5rem;font-size:.85rem}.tl div.done{border-color:var(--ok)}.tl div.cur{border-color:var(--red);font-weight:700}
.ring{--p:0;width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}.ring b{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.6rem}
#login{margin:auto;max-width:880px;width:100%;display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
#login .hero{background:linear-gradient(160deg,var(--pri2),#0a7a9a);color:#fff;padding:2rem;display:flex;flex-direction:column;justify-content:center}
#login .form{background:var(--card);padding:2rem}
.warnbox{background:var(--bg);border:1px dashed var(--mut);border-radius:6px;padding:.6rem;font-size:.8rem;margin-top:1rem}.warnbox code{cursor:pointer;color:var(--pri)}
.err{color:var(--red);font-size:.85rem}.tag.Overdue,.tag.Voided{color:var(--red);border-color:var(--red)}.pgn{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.cal .ch{font-size:.72rem;color:var(--mut);text-align:center;padding:.2rem 0}.cal .cd{min-height:78px;border:1px solid var(--bd);border-radius:4px;padding:2px;font-size:.72rem;overflow:hidden}.cal .cd.ch0{border:0}.cal .cd.tdy{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}.cal .ce{border-radius:3px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--pri);color:var(--pri)}.cal .ce.Completed{border-color:var(--ok);color:var(--ok)}.cal .ce.Missed{border-color:var(--red);color:var(--red)}@media(max-width:640px){.cal .cd{min-height:56px}.cal .ce{font-size:.62rem}}
.menu{display:none}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;padding:.5rem}nav .brand{display:flex;align-items:center;gap:.5rem;flex-shrink:0;padding:0 .5rem 0 0}nav .brand .lg{width:84px;margin:0;padding:.2rem}nav .brand b{font-size:.75rem;max-width:120px}nav .brand small{display:none}nav a{white-space:nowrap}.row{grid-template-columns:100px 1fr 40px}#login{grid-template-columns:1fr}}
@media print{nav,.noprint{display:none!important}}
.tag.Submitted{color:var(--ok);border-color:var(--ok)}.tag.Scheduled{color:var(--pri);border-color:var(--pri)}.tag.Missed{color:var(--red);border-color:var(--red)}.tag.Cancelled{color:var(--mut)}.tag.Completed{color:var(--ok);border-color:var(--ok)}.tag.New{color:var(--warn);border-color:var(--warn)}.tag.Handled{color:var(--ok);border-color:var(--ok)}.note{border:1px solid var(--bd);border-radius:8px;padding:.7rem;margin:.6rem 0}.note p{margin:.3rem 0;white-space:pre-wrap}.skip{position:absolute;left:-999px;top:0;background:var(--pri2);color:#fff;padding:.6rem 1rem;z-index:60;border-radius:0 0 8px 0}.skip:focus{left:0}main:focus{outline:none}nav a:focus-visible{outline-color:#fff}tr.click:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}@media(pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:40px}nav a{min-height:44px;align-items:center}}.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:1rem}.md{background:var(--card);border-radius:10px;padding:1.2rem;max-width:420px;width:100%}
</style></head>

 if(!b.data.users.some(u=>u.id===me.id&&u.role==="admin"&&u.active))return note("Restore cancelled: the backup doesn't include your administrator account as active, so you would be locked out.");
 if(!(await yes("Restore this backup from "+(b.t||"unknown date").slice(0,10)+"? Current users, candidates, rides, templates and assignments will be replaced. Submitted evaluations stay as they are.","Restore")))return;
 const IM=["evals","cevals"],keep={};
 COLS.filter(c=>c!=="comps").forEach(c=>{const inc=Array.isArray(b.data[c])?b.data[c].filter(o=>o&&typeof o.id==="string"):[];
  if(IM.includes(c)){const have=new Set(S[c].map(o=>o.id));inc.forEach(o=>{if(!have.has(o.id))S[c].push({...o,_t:nextT()})})}
  else{const old=Object.fromEntries(S[c].map(o=>[o.id,o]));S[c]=inc.map(o=>{const x={...o,_t:nextT()};if(c==="users"&&!x.pw&&old[x.id]&&old[x.id].pw)x.pw=old[x.id].pw;return x})}});
 if(b.data.comps&&typeof b.data.comps==="object")S.comps=b.data.comps;
 const mm=S.users.find(u=>u.id===me.id);if(mm)me=mm;log("Backup restored",(b.t||"").slice(0,10));save();render();note("Backup restored.")}

 <div class="g2"><div><div class="card"><label>Template name</label><input value="${h(t.name)}" onchange="tplName('${id}',this.value)"></div>

const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const mins=t=>{const[a,b]=t.split(":");return+a*60+ +b};
function addRide(e){const d=fd(e);let s=mins(d.start),en=mins(d.end);const cross=en<=s;if(cross)en+=1440;const hrs=Math.round((en-s)/60*100)/100;if(d.date>today()){err="The date can't be in the future.";return render()}if(cross&&!/night|24/i.test(d.type)){err="The end time is before the start time. For a shift that crosses midnight, choose a Night or Overnight shift type.";return render()}const _c=C(d.cid);if(!rtOf(_c).shifts.includes(d.type)){err=cn(_c)+"'s ride-time template allows: "+rtOf(_c).shifts.join(", ")+".";return render()}
 const dup=S.rides.find(r=>{if(r.void||r.cid!==d.cid||r.date!==d.date)return false;let a=mins(r.start),b=mins(r.end);if(b<=a)b+=1440;return s<b&&en>a});
 if(dup){err="This overlaps an existing entry for that candidate on "+d.date+".";return render()}err="";
 const nrid=uid("r");S.rides.push({id:nrid,evreq:me.role==="fto",cid:d.cid,fto:me.id,date:d.date,start:d.start,end:d.end,hrs,unit:d.unit,station:d.station,type:d.type,crew:d.crew,calls:+d.calls,pts:+d.pts,sp:d.sp,so:d.so,notes:d.notes,ack:false});
 const c=C(d.cid);log("Ride-time record created",cn(c),hrs+" h");notify(c.uid,"New ride-time entry for "+d.date+": please acknowledge it and complete your FTO review.");
 if(hrsOf(c.id)>=reqH(c)*.8&&hrsOf(c.id)-hrs<reqH(c)*.8)approvers().forEach(x=>notify(x,`Candidate ${cn(c)} has completed 80% of required ride time.`));const asn=d.aid?S.assigns.find(a=>a.id===d.aid&&a.fto===me.id&&a.cid===d.cid&&a.status==="Scheduled"):null;if(asn){asn.status="Completed";asn.rid=nrid;asn.done=new Date().toISOString();log("Assigned ride time completed",cn(c),asn.date)}rideFill=null;if(me.role==="fto"){evRid=nrid;view="eval";param=null}save();render()}

function addEvalSA(e){const d=fd(e),c=C(d.cid);if(me.role!=="fto"||!cfg().standaloneEval||!c||!d.date||d.date>today())return;const r={};evOf(c).cats.forEach((x,i)=>r[x]=+d["r"+i]);if(Object.values(r).some(v=>!(v>=1&&v<=5)))return;
 S.evals.push({id:uid("e"),rid:null,sa:true,cid:c.id,fto:me.id,date:d.date,ratings:r,strengths:d.strengths,improve:d.improve,coaching:d.coaching,remed:!!d.remed,rec:d.rec,signed:true,sub:new Date().toISOString()});
 log("Coaching evaluation submitted",cn(c));approvers().forEach(x=>notify(x,`New coaching evaluation submitted for ${cn(c)}.`));
 if(d.remed){c.remed=true;log("Candidate status changed",cn(c),"Needs remediation");approvers().forEach(x=>notify(x,`Candidate ${cn(c)} requires remediation.`))}save();render()}
function addEval(e){const d=fd(e),r={},rd=S.rides.find(x=>x.id===d.rid),c=rd&&C(rd.cid);if(me.role!=="fto"||!rd||!c||rd.fto!==me.id||S.evals.some(x=>x.rid===rd.id))return;evOf(c).cats.forEach((x,i)=>r[x]=+d["r"+i]);
 S.evals.push({id:uid("e"),rid:rd.id,cid:rd.cid,fto:me.id,date:rd.date,ratings:r,strengths:d.strengths,improve:d.improve,coaching:d.coaching,remed:!!d.remed,rec:d.rec,signed:true,sub:new Date().toISOString()});
 log("Evaluation submitted",cn(c));approvers().forEach(x=>notify(x,`New FTO evaluation submitted for ${cn(c)}.`));
 if(d.remed){c.remed=true;log("Candidate status changed",cn(c),"Needs remediation");approvers().forEach(x=>notify(x,`Candidate ${cn(c)} requires remediation.`))}save();render()}

async function setDate(cid,f,v){const c=C(cid);if(me.role!=="admin"||!c||!["hire","exp","orient"].includes(f))return;if(!v&&f!=="orient"){await note("Enter a valid date.");return render()}const hire=f==="hire"?v:c.hire,exp=f==="exp"?v:c.exp,or=f==="orient"?v:c.orient;if(exp<hire){await note("The expected completion date can't be before the hire date.");return render()}if(or&&or<hire){await note("The orientation date can't be before the hire date.");return render()}if(or&&or>exp){await note("The orientation date can't be after the expected completion date.");return render()}if((c[f]||"")===v)return;log("Candidate dates updated",cn(c),(f==="hire"?"Hire date ":f==="exp"?"Expected completion ":"Orientation date ")+(c[f]||"not set")+" → "+(v||"not set"));if(v)c[f]=v;else delete c[f];save();render()}

 if(real){me=real;real=null}if(me)log(auto?"Session timed out":"Sign out",me.name);me=null;err=auto?"Signed out after 15 minutes of inactivity.":"";render()}
async function addUser(e){const d=fd(e),em=d.email.trim().toLowerCase();if(S.users.some(u=>u.email.toLowerCase()===em)){err="That email is already in use.";return render()}err="";const pw=await hashPw(d.pw);if(S.users.some(u=>u.email.toLowerCase()===em)){err="That email is already in use.";return render()}S.users.push({id:uid("u"),name:d.name.trim(),email:em,role:d.role,active:true,pw,mustChange:true,created:today()});log("User created",d.name,d.role);save();render()}

function csvParse(t){t=t.replace(/^﻿/,"");const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";if(r.some(x=>x.trim()!==""))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()!==""))rows.push(r);return rows}
const csvCell=v=>{v=String(v??"");if(/^[=+\-@\t\r]/.test(v))v="'"+v;return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
async function csvSave(name,rows){const dl=window.claude?await claude.use("downloads"):null;if(!dl){await note("File downloads aren't available in this view.");return false}try{await dl.save({filename:name,data:rows.map(r=>r.map(csvCell).join(",")).join("\r\n")+"\r\n"});return true}catch(e){if(!e||e.code!=="declined")await note("Couldn't save the file.");return false}}
